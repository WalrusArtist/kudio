[package]
name = "kudio"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
crossterm = "0.29.0"
hound = "3.5.1"
midir = "0.11.1"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
